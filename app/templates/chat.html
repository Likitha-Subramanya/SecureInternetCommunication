<!DOCTYPE html>
<html>
<head>
    <title>Secure Chat</title>
</head>

<body>

    <h2>Secure Internet Communication</h2>

    <p>Send a secure message</p>

    <form method="POST">

        <label>Message:</label><br>

        <textarea
            name="message"
            rows="5"
            cols="50"
            placeholder="Enter your message"
            required
        ></textarea>

        <br><br>

        <button type="submit">Send Securely</button>

    </form>

</body>
</html>
